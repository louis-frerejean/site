<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable — Louis Frerejean</title>
    <link rel="icon" type="image/svg+xml" href="/site/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        --ink: #2a2118;
        --ink-dim: #6e6154;
        --ground: #faf6f0;
        --accent: #c2542a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ground);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      main {
        padding: 1.5rem;
      }
      .code {
        font-size: 4rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .code span {
        color: var(--accent);
      }
      p {
        color: var(--ink-dim);
        margin: 0.75rem 0 1.75rem;
      }
      a {
        display: inline-block;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        padding: 0.7rem 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">40<span>4</span></p>
      <p>Cette page n'existe pas ou plus.</p>
      <a href="/site/">Retour à l'accueil</a>
    </main>
  </body>
</html>
